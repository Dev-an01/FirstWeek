services:
  frontend:
    image: node:18-alpine
    container_name: firstweek-frontend
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - VITE_AUTH_TOKEN=${VITE_AUTH_TOKEN:-}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:3001}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-http://chat-service:3002}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://ai-officer-api:8000}
      - ONBOARDING_SERVICE_URL=${ONBOARDING_SERVICE_URL:-http://onboarding-service:8002}
      # Hot reload configuration
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
      # Exclude patterns for better file watching
      - /app/node_modules
      - /app/dist
      - /app/coverage
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: >
      sh -c "
        echo '🚀 [frontend] Starting setup...' &&

        # Install frontend dependencies
        echo '📦 Installing frontend dependencies...' &&
        npm install --include=dev &&

        # Start Vite dev server
        echo '🎨 Starting Vite dev server...' &&
        npm run dev -- --host 0.0.0.0
      "
    depends_on:
      auth-service:
        condition: service_started
      rag-api:
        condition: service_healthy
      onboarding-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true
    stdin_open: true
    tty: true

  auth-service:
    image: node:18-alpine
    container_name: auth-service
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-3001}
      - SERVICE_NAME=auth-service
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@avatar-user-db:5432/${DB_NAME}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - TEST_MODE=${TEST_MODE:-false}
      # Hot reload configuration
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - NODEMON_LEGACY_WATCH=false
      - NODE_OPTIONS=--max-old-space-size=2048
    volumes:
      - ./backend/auth-service:/app:cached
      - ./backend/logs/auth-service:/app/logs
      - auth_service_node_modules:/app/node_modules
      # Exclude patterns for better file watching
      - /app/logs
      - /app/.git
      - /app/coverage
      - /app/dist
      - /app/build
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:${AUTH_SERVICE_PORT:-3001}"
    command: >
      sh -c "
        echo '🚀 [auth-service] Starting setup...' &&

        # Install service dependencies
        echo '📦 Installing auth-service dependencies...' &&
        npm ci --include=dev &&
        npm run generate &&
        # Run database migrations (only for auth service)
        echo '🗄️ Running database migrations...' &&
        npm run db:push &&

        # Seed admin user if not exists
        echo '🌱 Seeding database (if needed)...' &&
        npm run db:seed &&

        npm run dev
      "
    depends_on:
      avatar-user-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    init: true
    stdin_open: true
    tty: true

  chat-service:
    image: node:18-alpine
    container_name: firstweek-chat-service
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHAT_SERVICE_PORT=${CHAT_SERVICE_PORT:-3002}
      - SERVICE_NAME=chat-service
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@avatar-user-db:5432/${CHAT_DB_NAME}
      - AUTH_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@avatar-user-db:5432/${DB_NAME}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - RAG_API_URL=${RAG_API_URL:-http://rag-api:8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_REAL_STREAMING=${ENABLE_REAL_STREAMING:-true}
      # Hot reload configuration
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - NODEMON_LEGACY_WATCH=false
      - NODE_OPTIONS=--max-old-space-size=2048
    volumes:
      - ./backend/chat-service:/app:cached
      - ./backend/logs/chat-service:/app/logs
      - chat_service_node_modules:/app/node_modules
      # Exclude patterns for better file watching
      - /app/logs
      - /app/.git
      - /app/coverage
      - /app/dist
      - /app/build
    ports:
      - "${CHAT_SERVICE_PORT:-3002}:${CHAT_SERVICE_PORT:-3002}"
    command: >
      sh -c "
        echo '🚀 [chat-service] Starting setup...' &&

        # Install service dependencies
        echo '📦 Installing chat-service dependencies...' &&
        npm ci --include=dev &&

        # Generate Prisma client
        echo '🔧 Generating Prisma client...' &&
        npm run generate &&

        # Run database migrations
        echo '🗄️ Running database migrations...' &&
        npm run db:push &&

        # Start server
        echo '💬 Starting chat service...' &&
        npm run dev
      "
    depends_on:
      avatar-user-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', (e) => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true
    stdin_open: true
    tty: true

  recall-service:
    image: node:18-alpine
    container_name: firstweek-recall-service
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3003
      - RECALL_API_KEY=${RECALL_API_KEY}
      - RECALL_API_URL=${RECALL_API_URL:-https://api.recall.ai/api/v1}
      - RECALL_BOT_NAME=${RECALL_BOT_NAME:-Sample Executive}
      - AVATAR_INTERFACE_URL=${AVATAR_INTERFACE_URL}
      - RAG_API_URL=http://rag-api:8000
      - DEFAULT_PROFILE_ID=${DEFAULT_PROFILE_ID:-sample_profile}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Hot reload configuration
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    volumes:
      - ./backend/recall-service:/app:cached
      - recall_service_node_modules:/app/node_modules
      - /app/node_modules
    ports:
      - "3003:3003"
    command: >
      sh -c "
        echo '🚀 [recall-service] Starting setup...' &&

        # Install dependencies
        echo '📦 Installing recall-service dependencies...' &&
        npm install --include=dev &&

        # Start server
        echo '🤖 Starting Recall service...' &&
        npm run dev
      "
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true
    stdin_open: true
    tty: true

  avatar-user-db:
    image: postgres:15-alpine
    container_name: avatar-user-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db-init/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "${DB_PORT}:5432"
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - firstweek-network
  # ============================================================================
  # RAG SERVICES (PostgreSQL + Neo4j + RAG API)
  # ============================================================================

  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-officer-postgres
    environment:
      POSTGRES_HOST: ${RAG_POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - rag_postgres:/var/lib/postgresql/data
      - ./RAG/config/postgres_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${RAG_POSTGRES_PORT:-5433}:5432"
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RAG_POSTGRES_USER:-postgres} -d ${RAG_POSTGRES_DB:-ai_officer}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - firstweek-network

  neo4j:
    image: neo4j:5.15-enterprise
    container_name: ai-officer-neo4j
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./RAG/test_data/graph_data/neo4j_import:/import:ro
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j123} 'RETURN 1' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    stop_grace_period: 120s
    stop_signal: SIGTERM
    restart: unless-stopped
    networks:
      - firstweek-network

  redis:
    image: redis:7-alpine
    container_name: ai-officer-redis
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - firstweek-network

  rag-api:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-api
    working_dir: /app
    environment:
      # Database connections (use service names for internal networking)
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}

      # Redis for L2 cache
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # LLM API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # Application settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}

      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cuda}

      # Audio TTS Configuration (Kokoro)
      DEFAULT_TTS_SERVICE: ${DEFAULT_TTS_SERVICE:-kokoro}
      ENABLE_AUDIO_STREAMING: ${ENABLE_AUDIO_STREAMING:-true}
      KOKORO_MODEL_PATH: ${KOKORO_MODEL_PATH:-//app/models/kokoro}
      KOKORO_VOICES_PATH: ${KOKORO_VOICES_PATH:-//app/models/kokoro/voices}
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-24000}
      AUDIO_BIT_DEPTH: ${AUDIO_BIT_DEPTH:-16}
      AUDIO_CHANNELS: ${AUDIO_CHANNELS:-1}
      JAPANESE_VOICE_ENABLED: ${JAPANESE_VOICE_ENABLED:-false}
      AUDIO_QUEUE_METRICS: ${AUDIO_QUEUE_METRICS:-false}

      # TTS Provider Selection (kokoro or chirp3_instant)
      DEFAULT_TTS_PROVIDER: ${DEFAULT_TTS_PROVIDER:-chirp3_instant}

      # Google Cloud TTS - Chirp 3 Instant Configuration
      GOOGLE_APPLICATION_CREDENTIALS: /app/Assets/key.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}

      # Auto-load data on first startup
      SKIP_EMBEDDINGS: ${SKIP_EMBEDDINGS:-false}
    volumes:
      - ./RAG:/app:cached
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/models
      # Mount Assets folder for Chirp 3 voice keys and GCP credentials
      - ./Assets:/app/Assets:ro
    ports:
      - "8000:8000"
    command: >
      sh -c '
        echo "🚀 [rag-api] Starting RAG API initialization..." &&

        # Wait for PostgreSQL
        echo "⏳ Waiting for PostgreSQL..." &&
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo "  PostgreSQL not ready, waiting..." &&
          sleep 2
        done &&
        echo "✓ PostgreSQL is ready" &&
        echo "✓ Neo4j is ready (verified by Docker health check)" &&

        # Give databases a moment to fully initialize
        sleep 5 &&

        # Check if data exists, auto-load if empty
        # Private knowledge is initialized explicitly through FirstWeek.

        # Start the API server
        echo "🎨 Starting FastAPI server..." &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --loop asyncio
      '
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # ==========================================================================
  # Onboarding Service - Executive profile management & calibration
  # ==========================================================================
  onboarding-service:
    image: aiofficer-rag-api
    container_name: ai-officer-onboarding
    working_dir: /app
    entrypoint: []
    environment:
      # Database connections (same as rag-api)
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}

      # LLM API Keys for extraction
      GROQ_EXTRACTION_API_KEY: ${GROQ_EXTRACTION_API_KEY:-}
      GROQ_SYNTHESIS_API_KEY: ${GROQ_SYNTHESIS_API_KEY:-}

      # Service settings
      ONBOARDING_SERVICE_PORT: 8002
      EMBEDDING_SERVICE_URL: http://embedding-service:8001

      # Application settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./RAG:/app:cached
      - /app/__pycache__
    ports:
      - "8002:8002"
    command: >
      sh -c '
        echo "🚀 [onboarding] Starting Onboarding Service..." &&

        # Wait for PostgreSQL
        echo "⏳ Waiting for PostgreSQL..." &&
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo "  PostgreSQL not ready, waiting..." &&
          sleep 2
        done &&
        echo "✓ PostgreSQL is ready" &&

        # Start the onboarding service
        echo "🎨 Starting Onboarding API on port 8002..." &&
        python -m onboarding.main
      '
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================================================
  # Embedding Service - Vector embedding generation & management
  # ==========================================================================
  embedding-service:
    image: aiofficer-rag-api
    container_name: ai-officer-embedding
    working_dir: /app
    entrypoint: []
    environment:
      # Database connections (same as rag-api)
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}

      # Redis for job queue
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Service settings
      EMBEDDING_SERVICE_HOST: 0.0.0.0
      EMBEDDING_SERVICE_PORT: 8001
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cuda}

      # Application settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./RAG:/app:cached
      - /app/__pycache__
    ports:
      - "8001:8001"
    command: >
      sh -c '
        echo "🚀 [embedding] Starting Embedding Service..." &&

        # Wait for PostgreSQL
        echo "⏳ Waiting for PostgreSQL..." &&
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo "  PostgreSQL not ready, waiting..." &&
          sleep 2
        done &&
        echo "✓ PostgreSQL is ready" &&

        # Start the embedding service
        echo "🎨 Starting Embedding API on port 8001..." &&
        python -m embedding_service.main
      '
    depends_on:
      rag-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  init-rag-db:
    image: postgres:17-alpine
    container_name: ai-officer-init-db
    environment:
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      DUMP_FILE: /dumps/ai_officer_backup.dump
      FORCE_RESTORE: ${FORCE_RESTORE:-false}
      MAX_RETRIES: 30
      RETRY_INTERVAL: 2
    volumes:
      - ./RAG/dumps:/dumps:ro
      - ./RAG/init-scripts:/scripts:ro
    depends_on:
      rag-postgres:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache bash dos2unix &&
        cp /scripts/02-restore-dump.sh /tmp/restore.sh &&
        dos2unix /tmp/restore.sh &&
        bash /tmp/restore.sh
      "
    networks:
      - firstweek-network
    restart: "no"

  init-neo4j:
    image: python:3.11-slim
    container_name: ai-officer-init-neo4j
    working_dir: /app
    environment:
      # Neo4j connection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}

      # PostgreSQL connection (for section migration)
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}

      # Script configuration
      MAX_RETRIES: 30
      RETRY_INTERVAL: 2
    volumes:
      - ./RAG:/app:ro
    depends_on:
      neo4j:
        condition: service_healthy
      rag-postgres:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update &&
        apt-get install -y dos2unix &&
        pip install --no-cache-dir neo4j psycopg2-binary python-dotenv sentence-transformers scikit-learn opentelemetry-api opentelemetry-sdk redis numpy PyYAML httpx prometheus-client psutil &&
        cp /app/init-scripts/03-init-neo4j.sh /tmp/init-neo4j.sh &&
        dos2unix /tmp/init-neo4j.sh &&
        chmod +x /tmp/init-neo4j.sh &&
        bash /tmp/init-neo4j.sh
      "
    networks:
      - firstweek-network
    restart: "no"

  # Reset databases and load fresh data (PostgreSQL + Neo4j + Embeddings)
  reset-databases:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-reset-databases
    working_dir: /app
    environment:
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      SKIP_EMBEDDINGS: ${SKIP_EMBEDDINGS:-false}
    volumes:
      - ./RAG:/app:cached
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Bundled persona initialization is retired. Use docs/firstweek/RUNBOOK.md.' >&2; exit 1;

        # Install PostgreSQL client
        apt-get update && apt-get install -y --no-install-recommends postgresql-client &&

        # Wait for database
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo '  Waiting for PostgreSQL...' &&
          sleep 2
        done &&

        echo '✓ PostgreSQL is ready' &&

        # Step 1: Load PostgreSQL data
        echo '📦 Loading PostgreSQL data...' &&
        python /app/init-scripts/load_postgres_data.py --docker --confirm &&

        # Step 2: Load Neo4j data
        echo '🔗 Loading Neo4j data...' &&
        python /app/init-scripts/load_neo4j_data.py --docker --confirm &&

        # Step 3: Generate embeddings (unless skipped)
        if [ \"$${SKIP_EMBEDDINGS}\" != 'true' ]; then
          echo '🧠 Generating embeddings...' &&
          python /app/init-scripts/generate_embeddings.py --docker
        else
          echo '⏭️ Skipping embeddings (SKIP_EMBEDDINGS=true)'
        fi &&

        echo '✅ Database reset and data loading complete!'
      "
    networks:
      - firstweek-network
    restart: "no"
    profiles:
      - reset

  # Load sample data (executive profile, policies, documents, embeddings)
  load-sample-data:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-load-sample-data
    working_dir: /app
    environment:
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      SKIP_EMBEDDINGS: ${SKIP_EMBEDDINGS:-false}
    volumes:
      - ./RAG:/app:cached
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      init-rag-db:
        condition: service_completed_successfully
    command: >
      sh -c "
        echo 'Bundled persona initialization is retired. Use docs/firstweek/RUNBOOK.md.' >&2; exit 1;

        # Install PostgreSQL client for pg_isready
        apt-get update && apt-get install -y --no-install-recommends postgresql-client &&

        # Wait for database
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo '  Waiting for PostgreSQL...' &&
          sleep 2
        done &&

        echo '✓ PostgreSQL is ready' &&

        # Step 1: Load PostgreSQL data
        echo '📦 Loading PostgreSQL data...' &&
        python /app/init-scripts/load_postgres_data.py --docker --confirm &&

        # Step 2: Load Neo4j data
        echo '🔗 Loading Neo4j data...' &&
        python /app/init-scripts/load_neo4j_data.py --docker --confirm &&

        # Step 3: Generate embeddings (unless skipped)
        if [ \"$${SKIP_EMBEDDINGS}\" != 'true' ]; then
          echo '🧠 Generating embeddings...' &&
          python /app/init-scripts/generate_embeddings.py --docker
        else
          echo '⏭️ Skipping embeddings (SKIP_EMBEDDINGS=true)'
        fi &&

        echo '✅ sample data loading complete!'
      "
    networks:
      - firstweek-network
    restart: "no"
    profiles:
      - init

volumes:
  db_data:
    driver: local
  auth_service_node_modules:
    driver: local
  chat_service_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  recall_service_node_modules:
    driver: local
  rag_postgres:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local

networks:
