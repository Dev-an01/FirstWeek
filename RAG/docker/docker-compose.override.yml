# This file is for local development overrides
# It's automatically merged with docker-compose.yml when you run 'docker-compose up'

version: '3.8'

services:
  rag-api:
    volumes:
      # Mount source code for live reload during development
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      # Development-specific settings
      LOG_LEVEL: DEBUG
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
