# LLM Integration Configuration
# Provider-agnostic LLM settings for AI Officer system

# Active provider selection (change this line to switch providers)
active_provider: "groq"  # Options: openai, glm, gemini, anthropic, groq, openrouter

# Provider Definitions
providers:
  openai:
    enabled: true
    api_base: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"  # Environment variable name
    models:
      fast: "gpt-4o-mini"           # For simple factual queries
      standard: "gpt-4o"            # For decision/recommendation queries
      complex: "gpt-4o"             # For comprehensive analysis
    pricing:  # Cost per 1M tokens in USD
      "gpt-4o-mini":
        input: 0.150
        output: 0.600
      "gpt-4o":
        input: 2.50
        output: 10.00
    parameters:
      supports_streaming: true
      supports_function_calling: true
      max_context_tokens: 128000
      
  glm:
    enabled: true
    api_base: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "GLM_API_KEY"
    models:
      fast: "glm-4-flash"
      standard: "glm-4"
      complex: "glm-4"
    pricing:  # Cost per 1M tokens in CNY (convert to USD)
      "glm-4-flash":
        input: 0.10
        output: 0.10
      "glm-4":
        input: 50.0
        output: 50.0
    parameters:
      supports_streaming: true
      supports_function_calling: true
      max_context_tokens: 128000
      
  anthropic:
    enabled: false
    api_base: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    models:
      fast: "claude-3-haiku-20240307"
      standard: "claude-3-5-sonnet-20241022"
      complex: "claude-3-5-sonnet-20241022"
    pricing:
      "claude-3-haiku-20240307":
        input: 0.25
        output: 1.25
      "claude-3-5-sonnet-20241022":
        input: 3.00
        output: 15.00
    parameters:
      supports_streaming: true
      supports_function_calling: false
      max_context_tokens: 200000
  
  gemini:
    enabled: true
    api_base: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"
    models:
      fast: "gemini-2.0-flash-exp"
      standard: "gemini-2.0-flash-exp"
      complex: "gemini-2.0-flash-exp"
      agentic: "gemini-2.0-flash-exp"
    pricing:  # Cost per 1M tokens in USD
      "gemini-2.5-pro":
        input: 0.00  # Free tier available
        output: 0.00
      "gemini-2.5-flash":
        input: 0.00
        output: 0.00
    parameters:
      supports_streaming: true
      supports_function_calling: true
      max_context_tokens: 2000000  # 2M tokens context!
      has_thinking_mode: true
  
  groq:
    enabled: true
    api_base: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    models:
      fast: "openai/gpt-oss-120b"
      standard: "openai/gpt-oss-120b"
      complex: "openai/gpt-oss-120b"
      agentic: "openai/gpt-oss-120b"
    pricing:  # Cost per 1M tokens in USD
      "openai/gpt-oss-120b":
        input: 0.00  # Check Groq pricing
        output: 0.00
    parameters:
      supports_streaming: true
      supports_function_calling: true
      max_context_tokens: 128000
      openai_compatible: true  # Uses OpenAI client with custom base URL

  openrouter:
    enabled: true
    api_base: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    models:
      fast: "minimax/minimax-m2:free"
      standard: "minimax/minimax-m2:free"
      complex: "minimax/minimax-m2:free"
      agentic: "minimax/minimax-m2:free"
    pricing:  # Cost per 1M tokens in USD
      "minimax/minimax-m2:free":
        input: 0.00  # Free tier
        output: 0.00
    parameters:
      supports_streaming: true
      supports_function_calling: true
      max_context_tokens: 64000
      openai_compatible: true  # Uses OpenAI client with custom base URL

# Path-specific settings (applies to all providers)
# NOTE: Lower temperatures (0.3-0.4) enforce stricter persona adherence
# Higher temps (0.6+) lead to "helpful assistant" verbosity
path_settings:
  fast:
    temperature: 0.35     # Low temp = strict persona, less "helper" bias
    max_tokens: 1000      # Increased from 300 to prevent cutoff mid-sentence
    top_p: 0.9
    timeout_seconds: 15

  standard:
    temperature: 0.4      # Lowered from 0.6 to enforce direct/blunt executive style
    max_tokens: 1500      # Increased from 600 for complete detailed responses
    top_p: 0.9
    timeout_seconds: 25

  agentic:
    temperature: 0.45     # Slightly higher for reasoning, but still strict
    max_tokens: 2000      # Increased from 800 for complex reasoning without cutoff
    top_p: 0.9
    timeout_seconds: 45

# Retry configuration
retry:
  max_attempts: 3
  initial_delay_seconds: 1
  max_delay_seconds: 10
  exponential_base: 2

# Cache configuration
cache:
  system_prompts:
    enabled: true
    ttl_seconds: 3600  # 1 hour
  few_shot_examples:
    enabled: true
    ttl_seconds: 1800  # 30 minutes
    
# Profile management
profiles:
  directory: "test_data/executive_profiles"
  file_pattern: "*.json"
  hot_reload:
    enabled: true
    check_interval_seconds: 10
  bootstrap_examples_count: 3  # How many bootstrap examples to include
  learned_examples_count: 2    # How many successful examples from DB

# Query Router Configuration
router:
  # Pattern matching rules
  patterns:
    fast:
      - "what is"
      - "who is"
      - "define"
      - "explain briefly"
      - "list"
      - "show me"
      - "tell me about"
      
    standard:
      - "should we"
      - "recommend"
      - "advise"
      - "how should"
      - "best practice"
      - "pros and cons"
      - "how to handle"
      - "approach"
      - "typically"
      - "usually"
      - "how does"
      - "strategy for"
      - "philosophy"
      - "style"
      - "method"
      # Opinion and values queries (for cognitive twin)
      - "what do you think"
      - "your opinion"
      - "your view"
      - "your perspective"
      - "how do you feel"
      - "what would you"
      - "advice"
      - "your thoughts"
      - "in your experience"
      - "how would you"
      - "what advice"
      
    agentic:
      - "compare"
      - "analyze"
      - "evaluate"
      - "trade-off"
      - "comprehensive"
      - "deep dive"
      - "versus"
      - "differences between"
      
  # Classification thresholds
  thresholds:
    entity_count_for_agentic: 5      # >5 entities → likely complex
    word_count_for_agentic: 30       # >30 words → might be complex (FIXED: was 15, too aggressive)
    min_confidence: 0.5              # Minimum confidence to use classification
    
  # Default fallback
  default_path: "standard"

# Logging
logging:
  level: "INFO"
  log_llm_requests: true
  log_llm_responses: false  # Set true for debugging (sensitive)
  log_prompts: true
  log_token_usage: true
