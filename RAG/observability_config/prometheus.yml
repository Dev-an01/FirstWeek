# Prometheus Configuration
# ========================
# Scrapes metrics from application and OTel collector

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai-officer-dev'
    environment: 'local'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Alert rules
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Scrape configurations
scrape_configs:
  # AI Officer API
  - job_name: 'ai-officer-api'
    static_configs:
      - targets: ['host.docker.internal:8000']  # For local dev
    metrics_path: '/metrics'
    scrape_interval: 15s
  
  # OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s
  
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
