server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Application logs (JSON structured logs)
  - job_name: ai-officer-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: ai-officer
          environment: dev
          __path__: /var/log/app/*.log

    # Parse JSON logs
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            component: component
            message: message
            request_id: request_id
            user_id: user_id
            executive_id: executive_id
            latency_ms: latency_ms
            tokens_used: tokens_used
            cost_usd: cost_usd
            model: model
            path: path
            error: error

      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339

      # Add labels from log fields
      - labels:
          level:
          component:
          request_id:
          executive_id:
          path:

      # Output final log line
      - output:
          source: message
