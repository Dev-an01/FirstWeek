# Alertmanager Configuration
# ==========================
# Basic configuration - Slack integration disabled by default
# See alertmanager.yml.example for Slack setup

global:
  resolve_timeout: 5m

# Route tree for alert distribution
route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 3h

  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m

    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 1h

    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h

# Receivers (notification destinations)
# Currently only logging - configure Slack in production
receivers:
  - name: 'default'
  - name: 'critical-alerts'
  - name: 'warning-alerts'
  - name: 'info-alerts'

# Inhibition rules
inhibit_rules:
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
