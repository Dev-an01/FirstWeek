version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-officer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_officer_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount init script only
      - ./config/postgres_schema.sql:/schemas/postgres_schema.sql:ro
      - ./config/episodic_memory_schema.sql:/schemas/episodic_memory_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_officer_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-officer-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15
    container_name: ai-officer-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-12341234}
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-12341234} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ai-officer-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-officer-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-officer-network

  # RAG API Application
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-officer-api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Database connections
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_officer_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-12341234}
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      
      # Groq API (REQUIRED - teammates must provide in .env)
      GROQ_API_KEY: ${GROQ_API_KEY}
      
      # Embedding model - MIGRATED to multilingual BAAI/bge-m3
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      
      # LLM settings
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      
      # Application settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Create writable marker directory
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai-officer-network

  # Embedding Service (BGE-M3 multilingual embeddings)
  embedding-service:
    build:
      context: .
      dockerfile: embedding_service/Dockerfile
    container_name: ai-officer-embedding
    environment:
      EMBEDDING_SERVICE_HOST: 0.0.0.0
      EMBEDDING_SERVICE_PORT: 8001
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_officer_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      # Redis for Celery task queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # HuggingFace cache
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai-officer-network

  # Onboarding Service (Executive profile generation pipeline)
  onboarding-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-officer-onboarding
    environment:
      # Database connections
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_officer_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-12341234}

      # LLM API keys for extraction/synthesis
      GROQ_EXTRACTION_API_KEY: ${GROQ_EXTRACTION_API_KEY:-${GROQ_API_KEY}}
      GROQ_SYNTHESIS_API_KEY: ${GROQ_SYNTHESIS_API_KEY:-${GROQ_API_KEY}}

      # Service config
      ONBOARDING_SERVICE_PORT: 8002
      EMBEDDING_SERVICE_URL: http://embedding-service:8001

      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    command: ["uvicorn", "onboarding.main:app", "--host", "0.0.0.0", "--port", "8002"]
    networks:
      - ai-officer-network

  # Database Initialization Service
  init-rag-db:
    image: postgres:17-alpine
    container_name: ai-officer-init-db
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_officer_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DUMP_FILE: /dumps/ai_officer_backup.dump
      FORCE_RESTORE: ${FORCE_RESTORE:-false}
      MAX_RETRIES: 30
      RETRY_INTERVAL: 2
    volumes:
      - ./dumps:/dumps:ro
      - ./init-scripts:/init-scripts:ro
      - ./config/postgres_schema.sql:/schemas/postgres_schema.sql:ro
      - ./config/onboarding_migration.sql:/migrations/onboarding_migration.sql:ro
      - ./config/phase8_migration.sql:/migrations/phase8_migration.sql:ro
      - ./config/phase9_multitenant_migration.sql:/migrations/phase9_multitenant_migration.sql:ro
      - ./config/phase10_ocr_metadata_migration.sql:/migrations/phase10_ocr_metadata_migration.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache bash &&
        cp /init-scripts/02-restore-dump.sh /tmp/restore.sh &&
        chmod +x /tmp/restore.sh &&
        /tmp/restore.sh
      "
    networks:
      - ai-officer-network
    restart: "no"

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-officer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aiofficer.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - ai-officer-network
    profiles:
      - tools

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  pgadmin_data:
  app_data:

networks:
  ai-officer-network:
    driver: bridge
