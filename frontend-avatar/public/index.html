<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstWeek Interface</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Load runtime configuration -->
    <script src="/config.js"></script>
</head>

<body>
    <!-- Main Container - Centered -->
    <div class="main-container">
        <!-- Avatar Video Section -->
        <div class="avatar-section">
            <div class="avatar-wrapper">
                <!-- Static Avatar Image (Fallback) -->
                <img id="avatar-img" src="/assets/avatar.png" alt="FirstWeek" class="avatar-idle">

                <!-- Live Video Canvas (Lip-sync) -->
                <canvas id="avatar-video-canvas" width="512" height="512" class="avatar-video"></canvas>

                <!-- Speaking Indicator -->
                <div id="speaking-indicator" class="speaking-indicator hidden">
                    <div class="pulse"></div>
                </div>
            </div>

            <!-- Status Text (Hidden but needed by JS) -->
            <p id="avatar-status" class="avatar-status-text hidden">Ready</p>

            <!-- Connection Status Badge -->
            <div id="connection-status" class="status-badge status-connected">
                <span class="status-dot"></span>
                <span id="status-text">Connected</span>
            </div>
        </div>

        <!-- Debug Console Section -->
        <div class="console-section">
            <div class="console-header">
                <span class="console-title">🖥️ Debug Console</span>
                <!-- Pipeline Status Indicators -->
                <div class="pipeline-indicators">
                    <span class="indicator" title="Page Status"><span id="pipe-page">⏳</span></span>
                    <span class="indicator" title="Audio Status"><span id="pipe-audio">⏳</span></span>
                    <span class="indicator" title="Audio Level"><span id="pipe-level">-</span></span>
                    <span class="indicator" title="STT Status"><span id="pipe-stt">⏳</span></span>
                    <span class="indicator" title="Avatar Status"><span id="pipe-avatar">⏳</span></span>
                </div>
            </div>

            <div id="console-logs" class="console-logs"></div>
        </div>
    </div>

    <!-- Hidden Debug Panel (for debug mode) -->
    <div id="debug-panel" class="debug-panel hidden">
        <h4>Debug Info</h4>
        <p>Connection: <span id="debug-connection">Disconnected</span></p>
        <p>Last Audio: <span id="debug-last-audio">None</span></p>
        <p>Audio Playing: <span id="debug-audio-playing">No</span></p>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="tts-audio" autoplay></audio>

    <!-- Scripts -->
    <!-- Self-hosted socket.io (v4.8.3) instead of a third-party CDN: removes the supply-chain
         risk entirely and keeps the page loadable under a strict same-origin CSP. -->
    <script src="/js/socket.io.min.js"></script>
    <script src="/js/videoRenderer.js"></script>
    <script src="/js/avatarVideoClient.js"></script>
    <script src="/js/jungle.js"></script>
    <script src="/js/webRTCClient.js"></script>
    <script src="/js/audioManager.js"></script>
    <script src="/js/avatar.js"></script>
</body>

</html>
