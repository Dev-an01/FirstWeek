<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content-Security-Policy (environment-agnostic so it works in dev, docker, and prod).
    - script-src/style-src keep 'unsafe-inline'/'unsafe-eval' ONLY because production currently
      serves the Vite dev server (HMR + injected react-refresh need them). Tighten to nonces/hashes
      once the app is served as a static production build.
    - connect-src uses schemes + localhost wildcards instead of hardcoded hosts so it survives env changes.
    - frame-ancestors can't be set via <meta>; clickjacking is covered by X-Frame-Options at the Caddy layer.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss: http://localhost:* https://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>FirstWeek — Your project, understood</title>
  <link rel="icon" type="image/svg+xml" href="/logo/header_logo.svg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
