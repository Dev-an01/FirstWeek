---
apiVersion: v1
kind: Service
metadata:
  name: avatar-interface
  namespace: firstweek
  labels:
    app: avatar-interface
spec:
  type: ClusterIP
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
      name: http
  selector:
    app: avatar-interface

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avatar-interface
  namespace: firstweek
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avatar-interface
  template:
    metadata:
      labels:
        app: avatar-interface
    spec:
      initContainers:
      - name: wait-for-rag
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z rag-api 8000; do
            echo "Waiting for rag-api..."
            sleep 2
          done
          echo "RAG API is ready!"
      containers:
      - name: avatar-interface
        image: gcr.io/PROJECT_ID/avatar-interface:latest  # REPLACE PROJECT_ID
        ports:
        - containerPort: 3004
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: NODE_ENV
        - name: PORT
          value: "3004"
        - name: RAG_API_URL
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: RAG_API_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
