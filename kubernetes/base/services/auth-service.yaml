---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: firstweek
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: auth-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: firstweek
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z avatar-user-db 5432; do
            echo "Waiting for avatar-user-db..."
            sleep 2
          done
          echo "Database is ready!"
      containers:
      - name: auth-service
        image: gcr.io/PROJECT_ID/auth-service:latest  # REPLACE PROJECT_ID
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: NODE_ENV
        - name: AUTH_SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: AUTH_SERVICE_PORT
        - name: SERVICE_NAME
          value: "auth-service"
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@avatar-user-db:5432/$(DB_NAME)"
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: DB_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: DB_PASSWORD
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: JWT_ACCESS_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: JWT_REFRESH_SECRET
        - name: JWT_ACCESS_EXPIRY
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: JWT_ACCESS_EXPIRY
        - name: JWT_REFRESH_EXPIRY
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: JWT_REFRESH_EXPIRY
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: FRONTEND_URL
        - name: COOKIE_DOMAIN
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: COOKIE_DOMAIN
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: LOG_LEVEL
        - name: GMAIL_ADDRESS
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: GMAIL_ADDRESS
        - name: GMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: GMAIL_PASSWORD
        - name: SEED_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: SEED_ADMIN_PASSWORD
        - name: TEST_MODE
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: TEST_MODE
        command:
        - sh
        - -c
        - |
          echo '[auth-service] Running database migrations...'
          npm run db:push
          echo '[auth-service] Seeding database...'
          npm run db:seed
          echo '[auth-service] Starting service...'
          node server.js
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
