---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-models-pvc
  namespace: firstweek
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard-rwo

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-cache-pvc
  namespace: firstweek
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard-rwo

---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: firstweek
  labels:
    app: rag-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: rag-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: firstweek
spec:
  replicas: 1  # GPU workloads typically don't need multiple replicas
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      # Node selector for GPU nodes
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4
      initContainers:
      - name: wait-for-databases
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z rag-postgres 5432; do
            echo "Waiting for rag-postgres..."
            sleep 2
          done
          until nc -z neo4j 7687; do
            echo "Waiting for neo4j..."
            sleep 2
          done
          until nc -z redis 6379; do
            echo "Waiting for redis..."
            sleep 2
          done
          echo "All databases are ready!"
      containers:
      - name: rag-api
        image: gcr.io/PROJECT_ID/rag-api:latest  # REPLACE PROJECT_ID
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: POSTGRES_HOST
          value: "rag-postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: RAG_POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: RAG_POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: RAG_POSTGRES_PASSWORD
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: NEO4J_URI
        - name: NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: NEO4J_PASSWORD
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: REDIS_HOST
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: REDIS_PASSWORD
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: OPENAI_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: GEMINI_API_KEY
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: GROQ_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: OPENROUTER_API_KEY
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: LOG_LEVEL
        - name: EMBEDDING_DEVICE
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: EMBEDDING_DEVICE
        - name: DEFAULT_TTS_SERVICE
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: DEFAULT_TTS_SERVICE
        - name: ENABLE_AUDIO_STREAMING
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: ENABLE_AUDIO_STREAMING
        - name: KOKORO_MODEL_PATH
          value: "/app/models/kokoro"
        - name: KOKORO_VOICES_PATH
          value: "/app/models/kokoro/voices"
        - name: AUDIO_SAMPLE_RATE
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: AUDIO_SAMPLE_RATE
        - name: AUDIO_BIT_DEPTH
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: AUDIO_BIT_DEPTH
        - name: AUDIO_CHANNELS
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: AUDIO_CHANNELS
        - name: JAPANESE_VOICE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: JAPANESE_VOICE_ENABLED
        - name: AUDIO_QUEUE_METRICS
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: AUDIO_QUEUE_METRICS
        - name: DEFAULT_TTS_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: DEFAULT_TTS_PROVIDER
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: GCP_PROJECT_ID
        - name: AUTO_LOAD_DATA
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: AUTO_LOAD_DATA
        - name: SKIP_EMBEDDINGS
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: SKIP_EMBEDDINGS
        volumeMounts:
        - name: rag-models
          mountPath: /app/models
        - name: rag-cache
          mountPath: /root/.cache
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: rag-models
        persistentVolumeClaim:
          claimName: rag-models-pvc
      - name: rag-cache
        persistentVolumeClaim:
          claimName: rag-cache-pvc
      # Toleration for GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
