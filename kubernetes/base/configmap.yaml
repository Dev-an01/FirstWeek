apiVersion: v1
kind: ConfigMap
metadata:
  name: firstweek-config
  namespace: firstweek
data:
  # Node.js environment
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # Ports
  AUTH_SERVICE_PORT: "3001"
  CHAT_SERVICE_PORT: "3002"
  FRONTEND_PORT: "5173"

  # JWT Configuration
  JWT_ACCESS_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"

  # Database Names
  DB_NAME: "avatar_user_db"
  CHAT_DB_NAME: "firstweek_chat"
  RAG_POSTGRES_DB: "ai_officer"

  # Database Users
  DB_USER: "postgres"
  RAG_POSTGRES_USER: "postgres"
  NEO4J_USER: "neo4j"

  # Internal Service URLs (Kubernetes DNS)
  AUTH_SERVICE_URL: "http://auth-service:3001"
  CHAT_SERVICE_URL: "http://chat-service:3002"
  RAG_API_URL: "http://rag-api:8000"
  AVATAR_INTERFACE_URL: "http://avatar-interface:3004"

  # Database Hosts (Kubernetes DNS)
  POSTGRES_HOST: "avatar-user-db"
  RAG_POSTGRES_HOST: "rag-postgres"
  REDIS_HOST: "redis"
  NEO4J_URI: "bolt://neo4j:7687"
  REDIS_URL: "redis://redis:6379"

  # Recall.ai Configuration
  RECALL_BOT_NAME: "Sample Executive"
  DEFAULT_PROFILE_ID: "exec_001_test"
  RECALL_API_URL: "https://api.recall.ai/api/v1"

  # RAG Configuration
  EMBEDDING_DEVICE: "cuda"
  DEFAULT_TTS_SERVICE: "kokoro"
  ENABLE_AUDIO_STREAMING: "true"
  AUDIO_SAMPLE_RATE: "24000"
  AUDIO_BIT_DEPTH: "16"
  AUDIO_CHANNELS: "1"
  JAPANESE_VOICE_ENABLED: "false"
  AUDIO_QUEUE_METRICS: "false"
  DEFAULT_TTS_PROVIDER: "chirp3_instant"
  GCP_PROJECT_ID: ""
  SKIP_EMBEDDINGS: "false"

  # Chat Service
  ENABLE_REAL_STREAMING: "true"

  # Test Mode
  TEST_MODE: "false"

  # LangGraph Configuration
  LANGGRAPH_ENABLED: "false"
  LANGGRAPH_TRAFFIC_PERCENTAGE: "0"
  LANGGRAPH_FALLBACK_ENABLED: "true"

  # Embedding Service Configuration
  EMBEDDING_SERVICE_ENABLED: "false"
  EMBEDDING_SERVICE_URL: "http://localhost:8001"
  EMBEDDING_FALLBACK_ENABLED: "true"
