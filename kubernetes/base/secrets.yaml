# This is a template file. DO NOT commit actual secrets to git.
# Use: kubectl create secret generic firstweek-secrets --from-env-file=.env -n firstweek
# Or use Google Secret Manager with Workload Identity

apiVersion: v1
kind: Secret
metadata:
  name: firstweek-secrets
  namespace: firstweek
type: Opaque
stringData:
  # Database Passwords (replace with actual values or use Secret Manager)
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  RAG_POSTGRES_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  NEO4J_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  REDIS_PASSWORD: ""

  # JWT Secrets (MUST be at least 32 characters)
  JWT_ACCESS_SECRET: "REPLACE_WITH_ACTUAL_JWT_ACCESS_SECRET_MIN_32_CHARS"
  JWT_REFRESH_SECRET: "REPLACE_WITH_ACTUAL_JWT_REFRESH_SECRET_MIN_32_CHARS"

  # Email Configuration
  GMAIL_ADDRESS: "REPLACE_WITH_GMAIL_ADDRESS"
  GMAIL_PASSWORD: "REPLACE_WITH_GMAIL_APP_PASSWORD"

  # Admin Password
  SEED_ADMIN_PASSWORD: "REPLACE_WITH_SECURE_ADMIN_PASSWORD"

  # API Keys
  RECALL_API_KEY: "REPLACE_WITH_RECALL_API_KEY"
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  GROQ_SUMMARIZATION_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  GROQ_FACT_EXTRACTION_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  GROQ_EVALUATOR_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
  OPENROUTER_API_KEY: "REPLACE_WITH_OPENROUTER_API_KEY"

  # LangSmith (Optional)
  LANGCHAIN_API_KEY: ""
  LANGSMITH_API_KEY: ""

  # Frontend URLs (update with actual domain)
  FRONTEND_URL: "https://your-domain.com"
  COOKIE_DOMAIN: "your-domain.com"
