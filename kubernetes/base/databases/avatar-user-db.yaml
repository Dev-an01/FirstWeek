---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avatar-user-db-pvc
  namespace: firstweek
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard-rwo

---
apiVersion: v1
kind: Service
metadata:
  name: avatar-user-db
  namespace: firstweek
  labels:
    app: avatar-user-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: avatar-user-db

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: avatar-user-db
  namespace: firstweek
spec:
  serviceName: avatar-user-db
  replicas: 1
  selector:
    matchLabels:
      app: avatar-user-db
  template:
    metadata:
      labels:
        app: avatar-user-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: DB_PASSWORD
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF8 --locale=C"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        command:
        - postgres
        - "-c"
        - "max_connections=200"
        - "-c"
        - "shared_buffers=256MB"
        - "-c"
        - "effective_cache_size=1GB"
        - "-c"
        - "work_mem=4MB"
        - "-c"
        - "maintenance_work_mem=64MB"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - avatar_user_db
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - avatar_user_db
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: avatar-user-db-pvc
      - name: init-script
        configMap:
          name: db-init-script
          optional: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
  namespace: firstweek
data:
  init-databases.sql: |
    -- Create chat database if it doesn't exist
    SELECT 'CREATE DATABASE firstweek_chat'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'firstweek_chat')\gexec
