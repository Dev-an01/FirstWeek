---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-postgres-pvc
  namespace: firstweek
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: standard-rwo

---
apiVersion: v1
kind: Service
metadata:
  name: rag-postgres
  namespace: firstweek
  labels:
    app: rag-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: rag-postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rag-postgres
  namespace: firstweek
spec:
  serviceName: rag-postgres
  replicas: 1
  selector:
    matchLabels:
      app: rag-postgres
  template:
    metadata:
      labels:
        app: rag-postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: RAG_POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: firstweek-config
              key: RAG_POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstweek-secrets
              key: RAG_POSTGRES_PASSWORD
        - name: POSTGRES_INITDB_ARGS
          value: "-E UTF8"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        command:
        - postgres
        - "-c"
        - "max_connections=200"
        - "-c"
        - "shared_buffers=256MB"
        - "-c"
        - "effective_cache_size=1GB"
        - "-c"
        - "work_mem=4MB"
        - "-c"
        - "maintenance_work_mem=64MB"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: schema-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - ai_officer
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - ai_officer
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: rag-postgres-pvc
      - name: schema-init
        configMap:
          name: rag-postgres-schema
          optional: true
