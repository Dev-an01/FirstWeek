# ============================================================================
# Production Docker Compose Configuration
# Purpose: Production-optimized setup with custom Dockerfiles for each service
# ============================================================================

services:
  # ==========================================================================
  # REVERSE PROXY (Caddy for SSL/TLS)
  # ==========================================================================

  caddy:
    image: caddy:2-alpine
    container_name: firstweek-caddy-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend
      - auth-service
      - chat-service
      - recall-service
      - avatar-interface
      - rag-api
    restart: unless-stopped
    networks:
      - firstweek-network

  # ==========================================================================
  # NODE.JS MICROSERVICES (with custom Dockerfiles)
  # ==========================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firstweek-frontend-prod
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-https://example.invalid}
      - VITE_CHAT_API_URL=${VITE_CHAT_API_URL:-/api/chat}
      - VITE_AUTH_TOKEN=${VITE_AUTH_TOKEN:-}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:3001}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-http://chat-service:3002}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://rag-api:8000}
      - ONBOARDING_SERVICE_URL=${ONBOARDING_SERVICE_URL:-http://onboarding-service:8002}
    # no volume mounts in production - built static files are in the image
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      auth-service:
        condition: service_started
      chat-service:
        condition: service_started
      rag-api:
        condition: service_started
      onboarding-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true

  recall-service:
    build:
      context: ./backend/recall-service
      dockerfile: Dockerfile
    container_name: firstweek-recall-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3003
      - RECALL_API_KEY=${RECALL_API_KEY}
      - RECALL_API_URL=${RECALL_API_URL:-https://api.recall.ai/api/v1}
      - RECALL_BOT_NAME=${RECALL_BOT_NAME:-Sample Executive}
      - AVATAR_INTERFACE_URL=${AVATAR_INTERFACE_URL}
      - RAG_API_URL=http://rag-api:8000
      - DEFAULT_PROFILE_ID=${DEFAULT_PROFILE_ID:-exec_001_test}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    # no volume mounts in production since all the code is inside the image made by the dockerfile.
    ports:
      - "3003:3003"
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true

  avatar-interface:
    build:
      context: ./frontend-avatar
      dockerfile: Dockerfile
    container_name: firstweek-interface-prod
    environment:
      - NODE_ENV=production
      - PORT=3004
      - RAG_API_URL=http://rag-api:8000
      - AVATAR_VIDEO_HOST=${AVATAR_VIDEO_HOST:-example.invalid}
      - AVATAR_VIDEO_PORT=${AVATAR_VIDEO_PORT:-}
      - AVATAR_VIDEO_PROTOCOL=${AVATAR_VIDEO_PROTOCOL:-wss}
      - AVATAR_VIDEO_PATH=${AVATAR_VIDEO_PATH:-}
    # no volume mounts in production
    ports:
      - "3004:3004"
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: firstweek-auth-service-prod
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-3001}
      - SERVICE_NAME=auth-service
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@avatar-user-db:5432/${DB_NAME}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - HOST=${HOST:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - TEST_MODE=${TEST_MODE:-false}
      - ONBOARDING_SERVICE_URL=http://onboarding-service:8002
    # no volume mounts in production - Prisma client is baked into the image
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:${AUTH_SERVICE_PORT:-3001}"
    command: >
      sh -c "
        echo '[auth-service] Running database migrations...' &&
        npm run db:push &&
        echo '[auth-service] Seeding database...' &&
        npm run db:seed &&
        echo '[auth-service] Starting service...' &&
        node server.js
      "
    depends_on:
      avatar-user-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    init: true

  chat-service:
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    container_name: firstweek-chat-service-prod
    environment:
      - NODE_ENV=production
      - CHAT_SERVICE_PORT=${CHAT_SERVICE_PORT:-3002}
      - SERVICE_NAME=chat-service
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@avatar-user-db:5432/${CHAT_DB_NAME}
      - AUTH_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@avatar-user-db:5432/${DB_NAME}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - HOST=${HOST:-}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - RAG_API_URL=${RAG_API_URL:-http://rag-api:8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_REAL_STREAMING=${ENABLE_REAL_STREAMING:-true}
    # no volume mounts in production - Both Prisma clients baked into the image
    ports:
      - "${CHAT_SERVICE_PORT:-3002}:${CHAT_SERVICE_PORT:-3002}"
    command: >
      sh -c "
        echo '[chat-service] Running database migrations...' &&
        npm run db:push &&
        echo '[chat-service] Starting service...' &&
        node server.js
      "
    depends_on:
      avatar-user-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', (e) => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true

  # ==========================================================================
  # INFRASTRUCTURE SERVICES (reuse from dev setup)
  # ==========================================================================

  avatar-user-db:
    image: postgres:15-alpine
    container_name: avatar-user-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db-init/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "${DB_PORT}:5432"
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - firstweek-network

  # RAG Services
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-officer-postgres-prod
    environment:
      POSTGRES_HOST: ${RAG_POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - rag_postgres:/var/lib/postgresql/data
      - ./RAG/config/postgres_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${RAG_POSTGRES_PORT:-5433}:5432"
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RAG_POSTGRES_USER:-postgres} -d ${RAG_POSTGRES_DB:-ai_officer}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - firstweek-network

  neo4j:
    image: neo4j:5.15-enterprise
    container_name: ai-officer-neo4j-prod
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./RAG/test_data/graph_data/neo4j_import:/import:ro
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j123} 'RETURN 1' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    stop_grace_period: 120s
    stop_signal: SIGTERM
    restart: unless-stopped
    networks:
      - firstweek-network

  redis:
    image: redis:7-alpine
    container_name: ai-officer-redis-prod
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - firstweek-network

  rag-api:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-api-prod
    working_dir: /app
    environment:
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cuda}
      DEFAULT_TTS_SERVICE: ${DEFAULT_TTS_SERVICE:-chirp3_instant}
      ENABLE_AUDIO_STREAMING: ${ENABLE_AUDIO_STREAMING:-true}
      KOKORO_MODEL_PATH: ${KOKORO_MODEL_PATH:-//app/models/kokoro}
      KOKORO_VOICES_PATH: ${KOKORO_VOICES_PATH:-//app/models/kokoro/voices}
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-24000}
      AUDIO_BIT_DEPTH: ${AUDIO_BIT_DEPTH:-16}
      AUDIO_CHANNELS: ${AUDIO_CHANNELS:-1}
      JAPANESE_VOICE_ENABLED: ${JAPANESE_VOICE_ENABLED:-false}
      AUDIO_QUEUE_METRICS: ${AUDIO_QUEUE_METRICS:-false}
      DEFAULT_TTS_PROVIDER: ${DEFAULT_TTS_PROVIDER:-chirp3_instant}
      GCP_VIDEO_SERVICE_URL: ${GCP_VIDEO_SERVICE_URL:-}
      GCP_VIDEO_EXECUTIVE_ID: ${GCP_VIDEO_EXECUTIVE_ID:-anand_idle_v2}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      AUTO_LOAD_DATA: ${AUTO_LOAD_DATA:-true}
      SKIP_EMBEDDINGS: ${SKIP_EMBEDDINGS:-false}
    volumes:
      # Mount all code directories (read-only for safety)
      - ./RAG/api:/app/api:ro
      - ./RAG/audio_services:/app/audio_services:ro
      - ./RAG/cache:/app/cache:ro
      - ./RAG/cognitive_twin:/app/cognitive_twin:ro
      - ./RAG/config:/app/config:ro
      - ./RAG/conversation_engine:/app/conversation_engine:ro
      - ./RAG/embedding_generation:/app/embedding_generation:ro
      - ./RAG/embedding_service:/app/embedding_service:ro
      - ./RAG/endpoints:/app/endpoints:ro
      - ./RAG/evaluation:/app/evaluation:ro
      - ./RAG/graph_context:/app/graph_context:ro
      - ./RAG/graph_rag:/app/graph_rag:ro
      - ./RAG/hybrid_retrieval:/app/hybrid_retrieval:ro
      - ./RAG/langgraph_workflow:/app/langgraph_workflow:ro
      - ./RAG/llm_integration:/app/llm_integration:ro
      - ./RAG/memory:/app/memory:ro
      - ./RAG/observability:/app/observability:ro
      - ./RAG/profile_management:/app/profile_management:ro
      - ./RAG/query_routing:/app/query_routing:ro
      - ./RAG/services:/app/services:ro
      - ./RAG/vector_search:/app/vector_search:ro
      - ./RAG/test_data:/app/test_data:ro
      # Persistent model storage (survives rebuilds and code changes)
      - rag_models:/app/models
      - rag_cache:/home/appuser/.cache
      # Assets (API keys, etc.)
      - ./Assets:/app/Assets:ro
    ports:
      - "8000:8000"
    command: >
      sh -c '
        echo "=� [rag-api] Starting RAG API initialization..." &&
        echo "� Waiting for PostgreSQL..." &&
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo "  PostgreSQL not ready, waiting..." &&
          sleep 2
        done &&
        echo "PostgreSQL is ready" &&
        echo "Neo4j is ready (verified by Docker health check)" &&
        sleep 5 &&
        if [ "$${AUTO_LOAD_DATA}" = "true" ]; then
          echo "🔍 Checking if database has data..." &&
          DATA_COUNT=$(PGPASSWORD=$${POSTGRES_PASSWORD} psql -h rag-postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} -t -c "SELECT COUNT(*) FROM executive_profiles" 2>/dev/null | tr -d " ") &&

          if [ "$${DATA_COUNT}" = "0" ] || [ -z "$${DATA_COUNT}" ]; then
            echo "📦 Database is empty - auto-loading sample data..." &&

            # Step 1: Load PostgreSQL data
            echo "  [1/3] Loading PostgreSQL data..." &&
            python /app/init-scripts/load_postgres_data.py --docker --confirm &&

            # Step 2: Load Neo4j data
            echo "  [2/3] Loading Neo4j data..." &&
            python /app/init-scripts/load_neo4j_data.py --docker --confirm &&

            # Step 3: Generate embeddings (unless skipped)
            if [ "$${SKIP_EMBEDDINGS}" != "true" ]; then
              echo "  [3/3] Generating embeddings..." &&
              python /app/init-scripts/generate_embeddings.py --docker
            else
              echo "  [3/3] Skipping embeddings (SKIP_EMBEDDINGS=true)"
            fi &&

            echo "✅ Auto-load complete!"
          else
            echo "✓ Database has data ($${DATA_COUNT} executive profiles) - skipping auto-load"
          fi
        fi &&
        echo "<� Starting FastAPI server..." &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --loop asyncio
      '
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-rag-cache:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # ==========================================================================
  # ONBOARDING SERVICE - Executive profile onboarding & document processing
  # ==========================================================================
  onboarding-service:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-onboarding-prod
    working_dir: /app
    environment:
      # Database connections (same as rag-api)
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}

      # LLM API Keys for extraction
      GROQ_EXTRACTION_API_KEY: ${GROQ_EXTRACTION_API_KEY:-}
      GROQ_SYNTHESIS_API_KEY: ${GROQ_SYNTHESIS_API_KEY:-}

      # Service settings
      ONBOARDING_SERVICE_PORT: 8002
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
      RAG_SERVICE_URL: http://rag-api:8000

      # Google Cloud TTS - voice key generation (uses VM service account via ADC)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_VOICE_CLONING_PROJECT_ID: ${GCP_VOICE_CLONING_PROJECT_ID:-}

      # Application settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Mount code directories (read-only for safety in production)
      - ./RAG/onboarding:/app/onboarding:ro
      - ./RAG/config:/app/config:ro
      - ./RAG/embedding_service:/app/embedding_service:ro
    ports:
      - "8002:8002"
    command: >
      sh -c '
        echo "🚀 [onboarding] Starting Onboarding Service..." &&

        # Wait for PostgreSQL
        echo "⏳ Waiting for PostgreSQL..." &&
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo "  PostgreSQL not ready, waiting..." &&
          sleep 2
        done &&
        echo "✓ PostgreSQL is ready" &&

        # Start the onboarding service
        echo "🎨 Starting Onboarding API on port 8002..." &&
        python -m onboarding.main
      '
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    init: true

  # ==========================================================================
  # EMBEDDING SERVICE - Vector embedding generation & management
  # ==========================================================================
  embedding-service:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-embedding-prod
    working_dir: /app
    environment:
      # Database connections (same as rag-api)
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}

      # Redis for job queue
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Service settings
      EMBEDDING_SERVICE_HOST: 0.0.0.0
      EMBEDDING_SERVICE_PORT: 8001
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cuda}

      # Application settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Mount code directories (read-only for safety in production)
      - ./RAG/embedding_service:/app/embedding_service:ro
      - ./RAG/config:/app/config:ro
      # Persistent model storage
      - rag_models:/app/models
      - rag_cache:/root/.cache
    ports:
      - "8001:8001"
    command: >
      sh -c '
        echo "🚀 [embedding] Starting Embedding Service..." &&

        # Wait for PostgreSQL
        echo "⏳ Waiting for PostgreSQL..." &&
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo "  PostgreSQL not ready, waiting..." &&
          sleep 2
        done &&
        echo "✓ PostgreSQL is ready" &&

        # Start the embedding service
        echo "🎨 Starting Embedding API on port 8001..." &&
        python -m embedding_service.main
      '
    depends_on:
      rag-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstweek-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # Init services
  init-rag-cache:
    image: alpine:latest
    container_name: init-rag-cache
    command: >
      sh -c "mkdir -p /cache/huggingface && chown -R 1000:1000 /cache && chmod -R 777 /cache"
    volumes:
      - rag_cache:/cache
    networks:
      - firstweek-network
    restart: "no"

  init-rag-db:
    image: postgres:17-alpine
    container_name: ai-officer-init-db-prod
    environment:
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      DUMP_FILE: /dumps/ai_officer_backup.dump
      FORCE_RESTORE: ${FORCE_RESTORE:-false}
      MAX_RETRIES: 30
      RETRY_INTERVAL: 2
    volumes:
      - ./RAG/dumps:/dumps:ro
      - ./RAG/init-scripts:/scripts:ro
    depends_on:
      rag-postgres:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache bash dos2unix &&
        cp /scripts/02-restore-dump.sh /tmp/restore.sh &&
        dos2unix /tmp/restore.sh &&
        bash /tmp/restore.sh
      "
    networks:
      - firstweek-network
    restart: "no"

  init-neo4j:
    build:
      context: ./RAG
      dockerfile: Dockerfile.init-neo4j
    container_name: ai-officer-init-neo4j-prod
    working_dir: /app
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      MAX_RETRIES: 30
      RETRY_INTERVAL: 2
    volumes:
      - ./RAG:/app:ro
    depends_on:
      neo4j:
        condition: service_healthy
      rag-postgres:
        condition: service_healthy
    command: >
      sh -c "
        cp /app/init-scripts/03-init-neo4j.sh /tmp/init-neo4j.sh &&
        dos2unix /tmp/init-neo4j.sh &&
        chmod +x /tmp/init-neo4j.sh &&
        bash /tmp/init-neo4j.sh
      "
    networks:
      - firstweek-network
    restart: "no"

  reset-databases:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-reset-databases
    working_dir: /app
    environment:
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      SKIP_EMBEDDINGS: ${SKIP_EMBEDDINGS:-false}
    volumes:
      - ./RAG:/app:cached
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: >
      sh -c "
        echo '🚀 Resetting databases and loading fresh data...' &&

        # Install PostgreSQL client
        apt-get update && apt-get install -y --no-install-recommends postgresql-client &&

        # Wait for database
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo '  Waiting for PostgreSQL...' &&
          sleep 2
        done &&

        echo '✓ PostgreSQL is ready' &&

        # Step 1: Load PostgreSQL data
        echo '📦 Loading PostgreSQL data...' &&
        python /app/init-scripts/load_postgres_data.py --docker --confirm &&

        # Step 2: Load Neo4j data
        echo '🔗 Loading Neo4j data...' &&
        python /app/init-scripts/load_neo4j_data.py --docker --confirm &&

        # Step 3: Generate embeddings (unless skipped)
        if [ \"$${SKIP_EMBEDDINGS}\" != 'true' ]; then
          echo '🧠 Generating embeddings...' &&
          python /app/init-scripts/generate_embeddings.py --docker
        else
          echo '⏭️ Skipping embeddings (SKIP_EMBEDDINGS=true)'
        fi &&

        echo '✅ Database reset and data loading complete!'
      "
    networks:
      - firstweek-network
    restart: "no"
    profiles:
      - reset

  # Load sample data (executive profile, policies, documents, embeddings)
  load-sample-data:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ai-officer-load-sample-data
    working_dir: /app
    environment:
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-ai_officer}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-postgres123}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      SKIP_EMBEDDINGS: ${SKIP_EMBEDDINGS:-false}
    volumes:
      - ./RAG:/app:cached
    depends_on:
      rag-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      init-rag-db:
        condition: service_completed_successfully
    command: >
      sh -c "
        echo '🚀 Loading sample executive profile data...' &&

        # Install PostgreSQL client for pg_isready
        apt-get update && apt-get install -y --no-install-recommends postgresql-client &&

        # Wait for database
        until pg_isready -h rag-postgres -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo '  Waiting for PostgreSQL...' &&
          sleep 2
        done &&

        echo '✓ PostgreSQL is ready' &&

        # Step 1: Load PostgreSQL data
        echo '📦 Loading PostgreSQL data...' &&
        python /app/init-scripts/load_postgres_data.py --docker --confirm &&

        # Step 2: Load Neo4j data
        echo '🔗 Loading Neo4j data...' &&
        python /app/init-scripts/load_neo4j_data.py --docker --confirm &&

        # Step 3: Generate embeddings (unless skipped)
        if [ \"$${SKIP_EMBEDDINGS}\" != 'true' ]; then
          echo '🧠 Generating embeddings...' &&
          python /app/init-scripts/generate_embeddings.py --docker
        else
          echo '⏭️ Skipping embeddings (SKIP_EMBEDDINGS=true)'
        fi &&

        echo '✅ sample data loading complete!'
      "
    networks:
      - firstweek-network
    restart: "no"
    profiles:
      - init

volumes:
  db_data:
    driver: local
  rag_postgres:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
  # RAG API model cache (persists across rebuilds)
  rag_models:
    driver: local
  rag_cache:
    driver: local
  # Caddy reverse proxy data
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local

networks:
  firstweek-network:
    driver: bridge
